[project]
name = "gestacao-api"  # Note: changed from gestacao_api to match your folder
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "alembic>=1.18.1,<2.0.0",
    "fastapi[standard]>=0.128.0,<0.129.0",
    "pwdlib[argon2]>=0.3.0,<0.4.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "aiosqlite>=0.22.1,<0.23.0",
    "sqlalchemy[asyncio]>=2.0.46,<3.0.0",
    "tzdata>=2025.3,<2026.0",
    "sqlmodel>=0.0.32,<0.0.33",
    "psycopg>=3.3.2",
    "asyncpg>=0.31.0",
]

# You might need to specify where your package is
[tool.setuptools.packages.find]
where = ["src"]  # If your code is in src/
# or if your code is in the root:
# where = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "taskipy>=1.14.1,<2.0.0",
    "ruff>=0.14.14,<0.15.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "factory-boy>=3.3.3,<4.0.0",
    "freezegun>=1.5.5,<2.0.0",
    "testcontainers>=4.14.0,<5.0.0"
]

[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

# Keep all your tool configurations below
[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
asyncio_default_fixture_loop_scope = 'function'

[tool.coverage.run]
core = "ctrace"
concurrency = ["thread", "greenlet"]

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev src/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=src -vv'
post_test = 'coverage html'
